services:
  - type: web
    name: t04-animal-monitor
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DATA_GO_KR_SERVICE_KEY
        sync: false
      - key: T04_REQUIRE_POSTGRES
        value: "false"
      - key: T04_ENABLE_SCHEDULER
        value: "false"
